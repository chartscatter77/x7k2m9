  'New Development': '#1565C0',   // unbuilt (built=0, has remaining) - blue
  'Room to Grow': '#00B89C',      // partially built (built>0, has remaining) - teal
  'Fully Built': '#9E9E9E'        // no remaining capacity - grey
};
var STATUS_ORDER = ['New Development', 'Room to Grow', 'Fully Built'];
function plotStatus(p) {
  var rem = p.rem || 0, built = p.built || 0;
  if (rem <= 0) return 'Fully Built';
  return (built > 0) ? 'Room to Grow' : 'New Development';
}

// FAR density class colors (sequential - light to dark = low to high density)
var FAR_COLORS = {
  'Low (<1)': '#C6E48B',
  'Medium (1-2)': '#7BC96F',
  'High (2-4)': '#239A3B',
  'Very High (>4)': '#196127'
};
var FAR_ORDER = ['Low (<1)', 'Medium (1-2)', 'High (2-4)', 'Very High (>4)'];
function farClass(p) {
  var f = p.far;
  if (f < 1) return 'Low (<1)';
  if (f < 2) return 'Medium (1-2)';
  if (f < 4) return 'High (2-4)';
  return 'Very High (>4)';
}

// Utilization % class colors (red = barely built/opportunity, green = complete)
var UTIL_COLORS = {
  '0% (not started)': '#E8743B',
  '1-50%': '#F8B100',
  '51-99%': '#A8C84F',
  '100% (complete)': '#19A979'
};
var UTIL_ORDER = ['0% (not started)', '1-50%', '51-99%', '100% (complete)'];
function utilClass(p) {
  var u = p.util || 0;
  if (u === 0) return '0% (not started)';
  if (u <= 50) return '1-50%';
  if (u < 100) return '51-99%';
  return '100% (complete)';
}

// Zone colors - a distinct palette for up to 14 zones
var ZONE_PALETTE = ['#000075','#3CB44B','#4363D8','#9A6324','#911EB4','#42D4F4','#F032E6','#7FFF00','#FABED4','#FF3D00','#000000','#8B0000','#FFD700','#0000FF'];
function zoneColor(zone) {
  // stable color by zone string
  var zlist = [];
  plots.forEach(function(p){ if(zlist.indexOf(p.zone)<0) zlist.push(p.zone); });
  zlist.sort(function(a,b){ return (parseInt(a)||999)-(parseInt(b)||999); });
  var idx = zlist.indexOf(zone);
  return ZONE_PALETTE[idx % ZONE_PALETTE.length];
}

function computeSize(p, sizeField, maxVal) {
  if (sizeField === 'none') return 8;
  var v = sizeField === 'gfa' ? p.gfa : sizeField === 'rem' ? (p.rem||0) : sizeField === 'area' ? p.pa : sizeField === 'pop' ? (p.pop||0) : (p.units||0);
  return 6 + (v / maxVal) * 30;
}
function sizeMax(sizeField) {
  if (sizeField === 'gfa') return maxGFA;
  if (sizeField === 'rem') return Math.max.apply(null, plots.map(p => p.rem || 0));
  if (sizeField === 'area') return Math.max.apply(null, plots.map(p => p.pa));
  if (sizeField === 'pop') return Math.max.apply(null, plots.map(p => p.pop || 0));
  if (sizeField === 'units') return Math.max.apply(null, plots.map(p => p.units || 0));
  return 1;
}

function buildPointTraces(sizeBy, colorBy) {
  var maxVal = sizeMax(sizeBy);
  var traces = [];

  // shared trace builder: handles isolate-fading + labels uniformly
  function pushGroup(name, g, baseColor){
    if (!g.length) return;
    var faded = (isolatedCat != null && name !== isolatedCat);
    var showTxt = (showLabels && !faded);
    traces.push({
      x: g.map(p => p.pa), y: g.map(p => p.gfa),
      mode: showTxt ? 'markers+text' : 'markers', type: 'scatter', name: name,
      text: showTxt ? g.map(p => p.desc) : undefined,
      textposition: 'top center', textfont: { size: 8.5, color: '#555' },
      marker: {
        size: g.map(p => computeSize(p, sizeBy, maxVal)),
        color: faded ? 'rgba(205,205,205,0.30)' : baseColor,
        line: { width: 0.5, color: faded ? '#e6e6e6' : '#fff' },
        opacity: faded ? 1 : 0.85
      },
      customdata: g.map(p => [p.id, p.desc, p.pa, p.gfa, (p.built||0), (p.rem||0), p.far, p.lu]),
      hovertemplate: '<extra></extra>'
    });
  }

  if (colorBy === 'status') {
    var statusGroups = {}; STATUS_ORDER.forEach(function(s){ statusGroups[s]=[]; });
    plots.forEach(p => { statusGroups[plotStatus(p)].push(p); });
    STATUS_ORDER.forEach(function(st){ pushGroup(st, statusGroups[st], STATUS_COLORS[st]); });
    return traces;
  }

  if (colorBy === 'far') {
    var farGroups = {}; FAR_ORDER.forEach(function(fc){ farGroups[fc] = []; });
    plots.forEach(p => { farGroups[farClass(p)].push(p); });
    FAR_ORDER.forEach(function(fc){ pushGroup(fc, farGroups[fc], FAR_COLORS[fc]); });
    return traces;
  }

  if (colorBy === 'util') {
    var utilGroups = {}; UTIL_ORDER.forEach(function(uc){ utilGroups[uc] = []; });
    plots.forEach(p => { utilGroups[utilClass(p)].push(p); });
    UTIL_ORDER.forEach(function(uc){ pushGroup(uc, utilGroups[uc], UTIL_COLORS[uc]); });
    return traces;
  }

  if (colorBy === 'zone') {
    var zoneGroups = {};
    plots.forEach(p => { if(!zoneGroups[p.zone]) zoneGroups[p.zone]=[]; zoneGroups[p.zone].push(p); });
    var zoneKeys = Object.keys(zoneGroups).sort(function(a,b){ return (parseInt(a)||999)-(parseInt(b)||999); });
    zoneKeys.forEach(function(z){ pushGroup('Zone ' + z, zoneGroups[z], zoneColor(z)); });
    return traces;
  }

  // Default: color by land use
  const groups = {};
  plots.forEach(p => { if (!groups[p.lu]) groups[p.lu] = []; groups[p.lu].push(p); });
  order.forEach(lu => { if (groups[lu]) pushGroup(lu, groups[lu], colors[lu] || '#BDBDBD'); });
  return traces;
}

// FAR lines drawn as LINE TRACES (real coordinates, work on log + linear)
function buildFARTraces() {
  const fars = [0.5, 1, 2, 4];
  // plot bounding box
  const xLo = minPA * 0.85, xHi = maxPA * 1.05;
  const yLo = minGFA * 0.85, yHi = maxGFA * 1.05;
  const traces = [];
  const labelX = [], labelY = [], labelText = [];
  fars.forEach(far => {
    // line y = far * x, clipped to the box
    let ax = xLo, ay = far * xLo;
    if (ay < yLo) { ay = yLo; ax = yLo / far; }
    let bx = xHi, by = far * xHi;
    if (by > yHi) { by = yHi; bx = yHi / far; }
    traces.push({
      x: [ax, bx], y: [ay, by],
      mode: 'lines', type: 'scatter',
      line: { color: '#999', width: 1, dash: far === 1 ? 'dash' : 'dot' },
      hoverinfo: 'skip', showlegend: false
    });
    labelX.push(bx); labelY.push(by); labelText.push('FAR ' + far.toFixed(1));
  });
  // labels as a text trace, nudged just below each line end so they stay visible
  traces.push({
    x: labelX, y: labelY, mode: 'text', type: 'scatter',
    text: labelText, textposition: 'bottom left',
    textfont: { size: 11, color: '#888' },
    hoverinfo: 'skip', showlegend: false,
    cliponaxis: false
  });
  return traces;
}

// Build tight convex-hull boundaries around selected zones' plots
function getSelectedZones() {
  var sel = [];
  document.querySelectorAll('#zoneCheckboxes input[type=checkbox]:checked').forEach(function(cb){
    sel.push(cb.value);
  });
  return sel;
}
// Convex hull (Andrew's monotone chain). Input/returns array of [x,y].
function convexHull(points) {
  if (points.length < 3) return points.slice();
  var pts = points.slice().sort(function(a,b){ return a[0]-b[0] || a[1]-b[1]; });
  function cross(o,a,b){ return (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]); }
  var lower = [];
  for (var i=0;i<pts.length;i++){
    while (lower.length>=2 && cross(lower[lower.length-2],lower[lower.length-1],pts[i])<=0) lower.pop();
    lower.push(pts[i]);
  }
  var upper = [];
  for (var j=pts.length-1;j>=0;j--){
    while (upper.length>=2 && cross(upper[upper.length-2],upper[upper.length-1],pts[j])<=0) upper.pop();
    upper.push(pts[j]);
  }
  lower.pop(); upper.pop();
  return lower.concat(upper);
}
// Expand a hull outward from its centroid by a padding factor (so it doesn't clip the dots)
function padHull(hull, padFactor, padAbs) {
  var cx = 0, cy = 0;
  hull.forEach(function(p){ cx += p[0]; cy += p[1]; });
  cx /= hull.length; cy /= hull.length;
  return hull.map(function(p){
    var dx = p[0]-cx, dy = p[1]-cy;
    var len = Math.sqrt(dx*dx+dy*dy) || 1;
    var ext = len*padFactor + padAbs;
    return [cx + dx/len*(len+ext), cy + dy/len*(len+ext)];
  });
}
function buildZoneHighlights(logScale) {
  var sel = getSelectedZones();
  if (!sel.length) return [];
  var traces = [];
  function tx(v){ return logScale ? Math.log10(v) : v; }
  function itx(v){ return logScale ? Math.pow(10, v) : v; }
  sel.forEach(function(z){
    var pts = plots.filter(function(p){ return p.zone === z; });
    if (!pts.length) return;
    var col = zoneColor(z);
    var rgb = hexToRgb(col);
    var coords = pts.map(function(p){ return [tx(p.pa), tx(p.gfa)]; });

    // LINK LINES: connect every dot in this zone to the zone centroid (hub-and-spoke),
    // so all plots sharing the zone are visibly linked.
    if (coords.length >= 2) {
      var cx = 0, cy = 0;
      coords.forEach(function(c){ cx += c[0]; cy += c[1]; });
      cx /= coords.length; cy /= coords.length;
      var lx = [], ly = [];
      coords.forEach(function(c){
        lx.push(itx(c[0]), itx(cx), null);  // null breaks the line so each is a separate spoke
        ly.push(itx(c[1]), itx(cy), null);
      });
      traces.push({
        x: lx, y: ly, mode: 'lines', type: 'scatter',
        line: { color: 'rgba('+rgb.r+','+rgb.g+','+rgb.b+',0.55)', width: 1 },
        name: 'Zone ' + z + ' links', hoverinfo: 'skip', showlegend: false
      });
    }

    if (coords.length === 1) {
      // single point: small circle around it
      var c = coords[0];
      var r = logScale ? 0.12 : maxPA*0.03;
      var ex=[], ey=[];
      for (var a=0;a<=360;a+=12){ var rad=a*Math.PI/180; ex.push(itx(c[0]+r*Math.cos(rad))); ey.push(itx(c[1]+r*Math.sin(rad))); }
      traces.push({ x:ex, y:ey, mode:'lines', type:'scatter', line:{color:col,width:2.5}, fill:'toself', fillcolor:'rgba('+rgb.r+','+rgb.g+','+rgb.b+',0.10)', name:'Zone '+z+' cluster', hoverinfo:'skip', showlegend:true });
      return;
    }
    if (coords.length === 2) {
      // two points: draw a capsule (stadium) shape enclosing both, so it's an area not a flat line
      var p0 = coords[0], p1 = coords[1];
      var dx = p1[0]-p0[0], dy = p1[1]-p0[1];
      var segLen = Math.sqrt(dx*dx+dy*dy) || 1;
      // unit vector along the segment, and perpendicular
      var ux = dx/segLen, uy = dy/segLen;
      var px = -uy, py = ux; // perpendicular
      var r = logScale ? 0.14 : maxPA*0.035; // capsule "radius" (half-width)
      var capX = [], capY = [];
      // semicircle around p1 end
      var baseAng = Math.atan2(dy, dx);
      var aa;
      for (aa = -90; aa <= 90; aa += 15) {
        var rad = baseAng + aa*Math.PI/180;
        capX.push(p1[0] + r*Math.cos(rad)); capY.push(p1[1] + r*Math.sin(rad));
      }
      // semicircle around p0 end (opposite direction)
      for (aa = 90; aa <= 270; aa += 15) {
        var rad2 = baseAng + aa*Math.PI/180;
        capX.push(p0[0] + r*Math.cos(rad2)); capY.push(p0[1] + r*Math.sin(rad2));
      }
      capX.push(capX[0]); capY.push(capY[0]); // close
      traces.push({
        x: capX.map(function(v){return itx(v);}),
        y: capY.map(function(v){return itx(v);}),
        mode:'lines', type:'scatter',
        line:{color:col,width:2.5, shape:'spline', smoothing:0.8},
        fill:'toself', fillcolor:'rgba('+rgb.r+','+rgb.g+','+rgb.b+',0.12)',
        name:'Zone '+z+' cluster', hoverinfo:'skip', showlegend:true
      });
      return;
    }

    // 3+ points: convex hull, padded slightly so it wraps just outside the dots
    var hull = convexHull(coords);
    // guard: if hull collapsed to <3 points (collinear), treat as 2-point capsule
    if (hull.length < 3) {
      // use the two extreme points
      var exPts = [coords[0], coords[coords.length-1]];
      var sorted = coords.slice().sort(function(a,b){ return a[0]-b[0] || a[1]-b[1]; });
      exPts = [sorted[0], sorted[sorted.length-1]];
      var dxc = exPts[1][0]-exPts[0][0], dyc = exPts[1][1]-exPts[0][1];
      var segL = Math.sqrt(dxc*dxc+dyc*dyc) || 1;
      var rC = logScale ? 0.14 : maxPA*0.035;
      var baseA = Math.atan2(dyc, dxc), cX=[], cY=[], aaC;
      for (aaC=-90; aaC<=90; aaC+=15){ var rdC=baseA+aaC*Math.PI/180; cX.push(exPts[1][0]+rC*Math.cos(rdC)); cY.push(exPts[1][1]+rC*Math.sin(rdC)); }
      for (aaC=90; aaC<=270; aaC+=15){ var rdC2=baseA+aaC*Math.PI/180; cX.push(exPts[0][0]+rC*Math.cos(rdC2)); cY.push(exPts[0][1]+rC*Math.sin(rdC2)); }
      cX.push(cX[0]); cY.push(cY[0]);
      traces.push({ x:cX.map(function(v){return itx(v);}), y:cY.map(function(v){return itx(v);}), mode:'lines', type:'scatter', line:{color:col,width:2.5,shape:'spline',smoothing:0.8}, fill:'toself', fillcolor:'rgba('+rgb.r+','+rgb.g+','+rgb.b+',0.12)', name:'Zone '+z+' cluster', hoverinfo:'skip', showlegend:true });
      return;
    }
    hull = padHull(hull, 0.06, logScale?0.06:maxPA*0.012);
    var hx = hull.map(function(p){ return itx(p[0]); });
    var hy = hull.map(function(p){ return itx(p[1]); });
    hx.push(hx[0]); hy.push(hy[0]); // close the polygon
    traces.push({
      x: hx, y: hy, mode: 'lines', type: 'scatter',
      line: { color: col, width: 2.5, shape: 'spline', smoothing: 0.6 },
      fill: 'toself', fillcolor: 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',0.12)',
      name: 'Zone ' + z + ' cluster',
      hoverinfo: 'skip', showlegend: true
    });
  });
  return traces;
}
function hexToRgb(hex){
  hex = hex.replace('#','');
  if (hex.length===3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
  return { r: parseInt(hex.substr(0,2),16), g: parseInt(hex.substr(2,2),16), b: parseInt(hex.substr(4,2),16) };
}

function render() {
  const sizeBy = document.getElementById('sizeBy').value;
  const colorBy = document.getElementById('colorBy').value;
  const logScale = document.getElementById('scaleType').value === 'log';
  const showFAR = document.getElementById('showFAR').checked;
  let traces = buildPointTraces(sizeBy, colorBy);
  // zone highlight circles drawn UNDER the points
  var zoneHL = buildZoneHighlights(logScale);
  if (zoneHL.length) traces = zoneHL.concat(traces);
  if (showFAR) traces = traces.concat(buildFARTraces());

  // search/click highlight ring (works for both building + non-building plots)
  if (highlightId != null) {
    var hpAll = plots.concat(zeroPlots).filter(function(p){ return String(p.id) === String(highlightId); });
    var hp = hpAll.filter(function(p){ return (p.gfa||0) > 0; }); // only main chart plots have gfa
    if (hp.length) {
      traces = traces.concat([{
        x: hp.map(function(p){return p.pa;}), y: hp.map(function(p){return p.gfa;}),
        mode:'markers', type:'scatter', hoverinfo:'skip', showlegend:false,
        marker:{ size: 34, color:'rgba(0,0,0,0)', line:{ width:3, color:'#FF1744' } }
      }]);
    }
  }

  const layout = {
    margin: { l: 75, r: 65, t: 10, b: 55 },
    xaxis: {
      title: 'Plot Area (m²' + (logScale ? ', log scale' : '') + ')',
      type: logScale ? 'log' : 'linear', gridcolor: '#f0f0f0', zeroline: false,
      range: logScale ? [Math.log10(minPA*0.8), Math.log10(maxPA*1.15)] : [0, maxPA*1.05]
    },
    yaxis: {
      title: 'GFA (m²' + (logScale ? ', log scale' : '') + ')',
      type: logScale ? 'log' : 'linear', gridcolor: '#f0f0f0', zeroline: false,
      range: logScale ? [Math.log10(minGFA*0.8), Math.log10(maxGFA*1.15)] : [0, maxGFA*1.05]
    },
    showlegend: true,
    legend: { font: { size: 11 }, x: 1, y: 0, xanchor: 'right', yanchor: 'bottom', bgcolor: 'rgba(255,255,255,0.85)', bordercolor: '#ddd', borderwidth: 1, itemsizing: 'constant' },
    hovermode: 'closest',
    dragmode: 'zoom', plot_bgcolor: '#fff', paper_bgcolor: '#fff'
  };
  var chartDiv = document.getElementById('chart');
  var plotConfig = {
    responsive: true,
    displayModeBar: true,
    displaylogo: false,
    modeBarButtonsToRemove: ['select2d', 'lasso2d'],
    scrollZoom: true
  };
  if (!window._chartInited) {
    Plotly.newPlot('chart', traces, layout, plotConfig);
    window._chartInited = true;
    bindChartEvents(chartDiv);
  } else {
    // update in place — no full rebuild, so the page doesn't jump/scroll
    Plotly.react('chart', traces, layout, plotConfig);
  }
}

function bindChartEvents(chartDiv){
  chartDiv.on('plotly_click', function(data) {
    var pt = data.points[0];
    if (pt && pt.customdata) {
      // ONLY show the info popup beside the dot.
      // Do NOT call render()/buildPlotTable() here — those rebuild the chart/table
      // and cause the chart to shift and the popup to jump.
      handlePlotClick(pt.customdata, false, data.event);
    }
  });

  // Legend click -> ISOLATE that category (keep it, fade others); click again to clear
  chartDiv.on('plotly_legendclick', function(ev){
    try {
      var name = ev.data[ev.curveNumber].name;
      // ignore FAR reference lines / zone hull / link lines (they have no customdata points)
      if (name && name.indexOf('FAR') !== 0 && name.indexOf('cluster') < 0) {
        isolatedCat = (isolatedCat === name) ? null : name;
        render();
        buildPlotTable();
      }
    } catch(e){}
    return false; // prevent Plotly's default hide behavior
  });

  function fallbackCopy(txt) {
    var ta = document.createElement('textarea');
    ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand('copy'); showCopied(txt); } catch(e) {}
    document.body.removeChild(ta);
  }

  function showCopied(plotId) {
    var note = document.getElementById('copyNote');
    if (!note) {
      note = document.createElement('div');
      note.id = 'copyNote';
      note.style.cssText = 'position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#19A979;color:#fff;padding:8px 16px;border-radius:8px;font-size:14px;z-index:9999;box-shadow:0 2px 8px rgba(0,0,0,0.2);transition:opacity 0.3s;';
      document.body.appendChild(note);
    }
    note.textContent = 'Copied Plot ID: ' + plotId;
    note.style.opacity = '1';
    clearTimeout(window._copyTimer);
    window._copyTimer = setTimeout(function(){ note.style.opacity = '0'; }, 1800);
  }
}

// ---- Global click handling: show info panel + copy Plot ID ----
function gShowCopied(plotId) {
  var note = document.getElementById('copyNote');
  if (!note) {
    note = document.createElement('div');
    note.id = 'copyNote';
    note.style.cssText = 'position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#19A979;color:#fff;padding:8px 16px;border-radius:8px;font-size:14px;z-index:9999;box-shadow:0 2px 8px rgba(0,0,0,0.2);transition:opacity 0.3s;';
    document.body.appendChild(note);
  }
  note.textContent = 'Copied Plot ID: ' + plotId;
  note.style.opacity = '1';
  clearTimeout(window._copyTimer);
  window._copyTimer = setTimeout(function(){ note.style.opacity = '0'; }, 1800);
}
function gCopy(txt) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(function(){ gShowCopied(txt); }, function(){ gFallbackCopy(txt); });
  } else { gFallbackCopy(txt); }
}
function gFallbackCopy(txt) {
  var ta = document.createElement('textarea');
  ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try { document.execCommand('copy'); gShowCopied(txt); } catch(e) {}
  document.body.removeChild(ta);
}
function lightenColor(hex, amount) {
  // amount 0..1, higher = lighter (mix toward white)
  hex = (hex || '#cccccc').replace('#','');
  if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
  var r = parseInt(hex.substr(0,2),16), g = parseInt(hex.substr(2,2),16), b = parseInt(hex.substr(4,2),16);
  r = Math.round(r + (255 - r) * amount);
  g = Math.round(g + (255 - g) * amount);
  b = Math.round(b + (255 - b) * amount);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

function handlePlotClick(cd, isNonBuilding, evt) {
  // cd = [id, desc, pa, gfa, built, rem, far, lu]
  var id = cd[0], desc = cd[1], pa = cd[2], gfa = cd[3], built = cd[4], rem = cd[5], far = cd[6], lu = cd[7];

  var html = '<b>Plot ' + id + '</b><br>' + desc + '<br>Area: ' + Number(pa).toLocaleString() + ' m&sup2;';
  if (isNonBuilding) {
    html += '<br>GFA: 0 (non-building land)';
  } else {
    html += '<br>Allowed GFA: ' + Number(gfa).toLocaleString() + ' m&sup2;';
    html += '<br>Built GFA: ' + Number(built).toLocaleString() + ' m&sup2;';
    html += '<br>Remaining GFA: ' + Number(rem).toLocaleString() + ' m&sup2;';
    html += '<br>FAR: ' + far;
  }

  // Light tint of the land use color for the popup background
  var baseColor = colors[lu] || '#cccccc';
  var bgTint = lightenColor(baseColor, 0.80);   // very light fill
  var borderTint = lightenColor(baseColor, 0.35); // stronger border

  var pop = document.getElementById('clickPopup');
  if (!pop) {
    pop = document.createElement('div');
    pop.id = 'clickPopup';
    document.body.appendChild(pop);
  }
  pop.style.cssText = 'position:fixed; z-index:9998; background:' + bgTint + '; border:1px solid ' + borderTint + '; border-left:4px solid ' + baseColor + '; border-radius:6px; box-shadow:0 3px 12px rgba(0,0,0,0.18); padding:10px 12px; font-size:12px; line-height:1.5; color:#222; max-width:240px;';
  var closeBtn = '<span id="popClose" style="position:absolute;top:4px;right:8px;cursor:pointer;color:#777;font-size:14px;">&times;</span>';
  pop.innerHTML = closeBtn + html;
  pop.style.display = 'block';

  // Position the popup beside the clicked dot
  var x = (evt && evt.clientX) ? evt.clientX : (window.innerWidth/2);
  var y = (evt && evt.clientY) ? evt.clientY : (window.innerHeight/2);
  var pw = 240, ph = pop.offsetHeight || 130;
  var left = x + 12; if (left + pw > window.innerWidth) left = x - pw - 12;
  var top = y + 12; if (top + ph > window.innerHeight) top = y - ph - 12;
  pop.style.right = '';
  pop.style.left = Math.max(8,left) + 'px';
  pop.style.top = Math.max(8,top) + 'px';

  document.getElementById('popClose').onclick = function(){
    pop.style.display = 'none';
    if(highlightId!=null){
      highlightId=null;
      var si=document.getElementById('plotSearch');
      if(si){ si.value=''; var sc=document.getElementById('searchClear'); if(sc) sc.style.display='none'; }
      render(); buildPlotTable();
    }
  };
}

function renderZeroStrip() {
  // Group zero plots by land use for coloring
  var groups = {};
  zeroPlots.forEach(function(p){ if(!groups[p.lu]) groups[p.lu]=[]; groups[p.lu].push(p); });
  var stripTraces = [];
  var maxZeroPA = Math.max.apply(null, zeroPlots.map(function(p){return p.pa;}));
  Object.keys(groups).forEach(function(lu){
    var g = groups[lu];
    stripTraces.push({
      x: g.map(function(p){return p.pa;}),
      y: g.map(function(){return 0;}),
      mode: 'markers', type: 'scatter', name: lu,
      marker: { size: g.map(function(p){return 6 + (p.pa/maxZeroPA)*22;}), color: colors[lu] || '#BDBDBD', line: { width: 0.5, color: '#fff' }, opacity: 0.85 },
      customdata: g.map(function(p){return [p.id, p.desc, p.pa, 0, 0, 0, 0, lu];}),
      hovertemplate: '<extra></extra>'
    });
  });
  var stripLayout = {
    margin: { l: 75, r: 200, t: 6, b: 30 },
    height: 150,
    xaxis: { title: 'Plot Area (m2, log scale)', type: 'log', gridcolor: '#f0f0f0', zeroline: false },
    yaxis: { visible: false, range: [-1, 1], fixedrange: true },
    showlegend: true,
    legend: { font: { size: 10 }, x: 1.02, y: 0.5, xanchor: 'left', yanchor: 'middle', bgcolor: 'rgba(255,255,255,0)', itemsizing: 'constant' },
    hovermode: 'closest',
    dragmode: false,
    plot_bgcolor: '#fafafa', paper_bgcolor: '#fafafa'
  };
  Plotly.newPlot('zeroStrip', stripTraces, stripLayout, {
    responsive: true,
    displayModeBar: true,
    displaylogo: false,
    modeBarButtonsToRemove: ['select2d', 'lasso2d'],
    scrollZoom: true
  });
  // click on strip point to show info panel and copy ID
  document.getElementById('zeroStrip').on('plotly_click', function(data){
    var pt = data.points[0];
    if (pt && pt.customdata) {
      handlePlotClick(pt.customdata, true, data.event);
    }
  });
}

function startChart() {
  document.getElementById('status').style.display = 'none';
  document.getElementById('chart').style.display = 'block';
  document.getElementById('zeroStrip').style.display = 'block';
  document.getElementById('zeroStripLabel').style.display = 'block';
  document.getElementById('sizeBy').addEventListener('change', render);
  document.getElementById('colorBy').addEventListener('change', function(){
    isolatedCat = null;   // category names differ per mode, so reset isolate
    render();
    buildPlotTable();
  });
  document.getElementById('scaleType').addEventListener('change', render);
  document.getElementById('showFAR').addEventListener('change', render);

  // Populate zone highlight checkboxes
  var zoneSet = [];
  plots.forEach(function(p){ if(zoneSet.indexOf(p.zone)<0) zoneSet.push(p.zone); });
  zoneSet.sort(function(a,b){ return (parseInt(a)||999)-(parseInt(b)||999); });
  var cbHtml = '';
  zoneSet.forEach(function(z){
    var col = zoneColor(z);
    cbHtml += '<label style="display:flex;align-items:center;gap:6px;padding:3px 4px;cursor:pointer;font-size:12px;">' +
      '<input type="checkbox" value="' + z + '" class="zoneChk"> ' +
      '<span style="width:12px;height:12px;border-radius:3px;background:' + col + ';display:inline-block;"></span> Zone ' + z + '</label>';
  });
  document.getElementById('zoneCheckboxes').innerHTML = cbHtml;

  // toggle dropdown panel
  document.getElementById('zoneDropBtn').addEventListener('click', function(e){
    e.stopPropagation();
    var panel = document.getElementById('zoneDropPanel');
    panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
  });
  // close panel when clicking outside
  document.addEventListener('click', function(e){
    var panel = document.getElementById('zoneDropPanel');
    var btn = document.getElementById('zoneDropBtn');
    if (panel.style.display === 'block' && !panel.contains(e.target) && e.target !== btn) {
      panel.style.display = 'none';
    }
  });
  // checkbox change -> re-render and update button label
  document.getElementById('zoneCheckboxes').addEventListener('change', function(){
    updateZoneBtnLabel();
    render();
  });
  // clear all
  document.getElementById('zoneClearAll').addEventListener('change', function(){
    if (this.checked) {
      document.querySelectorAll('.zoneChk').forEach(function(cb){ cb.checked = false; });
      this.checked = false;
      updateZoneBtnLabel();
      render();
    }
  });
  function updateZoneBtnLabel(){
    var sel = getSelectedZones();
    var btn = document.getElementById('zoneDropBtn');
    btn.textContent = sel.length ? (sel.length + ' zone' + (sel.length>1?'s':'') + ' ▾') : 'Select zones ▾';
  }

  render();
  renderZeroStrip();
  setupSearch();
  buildPlotTable();
  // labels toggle
  (function(){
    var wrap=document.getElementById('labelToggleWrap');
    var sw=document.getElementById('labelToggleSwitch');
    var knob=document.getElementById('labelToggleKnob');
    if(wrap) wrap.onclick=function(){
      showLabels=!showLabels;
      sw.style.background = showLabels ? '#005baa' : '#cbd5de';
      knob.style.left = showLabels ? '18px' : '2px';
      render();
    };
  })();
}

// ---- Search box ----
function setupSearch(){
  var input=document.getElementById('plotSearch');
  var resultsBox=document.getElementById('searchResults');
  var clearBtn=document.getElementById('searchClear');
  var allSearchable = plots.concat(zeroPlots);

  function doSearch(q){
    q=(q||'').trim().toLowerCase();
    clearBtn.style.display = q ? 'block' : 'none';
    if(!q){ resultsBox.style.display='none'; return; }
    function score(p){
      var id=String(p.id).toLowerCase(), desc=(p.desc||'').toLowerCase();
      if(id.indexOf(q)===0 || desc.indexOf(q)===0) return 3;
      var words=desc.split(/[^a-z0-9]+/);
      for(var i=0;i<words.length;i++){ if(words[i].indexOf(q)===0) return 2; }
      if(id.indexOf(q)>=0 || desc.indexOf(q)>=0) return 1;
      return 0;
    }
    var scored=[];
    allSearchable.forEach(function(p){ var s=score(p); if(s>0) scored.push({p:p,s:s}); });
    scored.sort(function(a,b){
      if(b.s!==a.s) return b.s-a.s;
      if((a.p.desc||'').length!==(b.p.desc||'').length) return (a.p.desc||'').length-(b.p.desc||'').length;
      return (a.p.desc||'').localeCompare(b.p.desc||'');
    });
    var matches=scored.slice(0,12).map(function(x){return x.p;});
    if(!matches.length){ resultsBox.innerHTML='<div style="padding:9px 12px;font-size:12px;color:#999;">No plot found</div>'; resultsBox.style.display='block'; return; }
    var html='';
    matches.forEach(function(p){
      var gfaTxt = (p.gfa||0)>0 ? Number(p.gfa).toLocaleString()+' m² GFA' : 'non-building plot';
      html+='<div class="searchRow" data-id="'+p.id+'" style="padding:8px 12px;font-size:12px;cursor:pointer;border-bottom:1px solid #f0f0f0;">'+
            '<b>'+p.desc+'</b><br><span style="color:#999;font-size:11px;">Plot '+p.id+' · '+p.lu+' · '+gfaTxt+'</span></div>';
    });
    resultsBox.innerHTML=html; resultsBox.style.display='block';
    Array.prototype.forEach.call(resultsBox.querySelectorAll('.searchRow'), function(row){
      row.onmouseover=function(){ row.style.background='#f2f7fc'; };
      row.onmouseout=function(){ row.style.background='#fff'; };
      row.onclick=function(){ selectPlot(row.getAttribute('data-id')); };
    });
  }
  function selectPlot(id){
    highlightId=id; resultsBox.style.display='none';
    var p=plots.concat(zeroPlots).filter(function(x){return String(x.id)===String(id);})[0];
    if(p) input.value=p.desc;
    render(); buildPlotTable();
    if(p && (p.gfa||0)>0){
      handlePlotClick([p.id,p.desc,p.pa,p.gfa,(p.built||0),(p.rem||0),p.far,p.lu], false, null);
    }
  }
  input.addEventListener('input', function(){
    if(!input.value.trim() && highlightId!=null){ highlightId=null; render(); buildPlotTable(); }
    doSearch(input.value);
  });
  input.addEventListener('focus', function(){ if(input.value.trim()) doSearch(input.value); });
  clearBtn.onclick=function(){ input.value=''; highlightId=null; resultsBox.style.display='none'; clearBtn.style.display='none'; render(); buildPlotTable(); };
  document.addEventListener('click', function(e){
    var w=document.getElementById('plotSearch').parentNode;
    if(!w.contains(e.target)) resultsBox.style.display='none';
  });
}

// ---- Table (two-way linked with chart) ----
// Returns the category name a plot belongs to under the current colorBy mode (matches legend names)
function plotCategory(p){
  var cb = document.getElementById('colorBy').value;
  if (cb === 'status') return plotStatus(p);
  if (cb === 'far') return farClass(p);
  if (cb === 'util') return utilClass(p);
  if (cb === 'zone') return 'Zone ' + p.zone;
  return p.lu;
}
function buildPlotTable(){
  var box=document.getElementById('plotTable');
  var list=plots.slice();
  // filter to the isolated legend category, if any
  if (isolatedCat != null) {
    list = list.filter(function(p){ return plotCategory(p) === isolatedCat; });
  }
  list.sort(function(a,b){ return b.gfa - a.gfa; });
  var titleSuffix = (isolatedCat != null) ? (' · showing <b>' + isolatedCat + '</b> only') : '';
  var html='<div style="font-size:13px;font-weight:700;color:#333;margin-bottom:8px;border-top:1px solid #e8e8e8;padding-top:12px;">Plot details &mdash; '+list.length+' plots <span style="font-weight:400;color:#999;">(sorted by GFA · click a row to find it on the chart'+titleSuffix+')</span></div>';
  html+='<div style="max-height:280px;overflow-y:auto;border:1px solid #eee;border-radius:8px;">';
  // header row
  html+='<div style="display:flex;align-items:center;gap:10px;padding:7px 11px;background:#f6f8fa;font-size:11px;font-weight:700;color:#666;position:sticky;top:0;">'+
        '<span style="min-width:62px;">Plot ID</span>'+
        '<span style="flex:1 1 auto;">Description</span>'+
        '<span style="min-width:90px;">Land Use</span>'+
        '<span style="min-width:80px;text-align:right;">GFA (m²)</span>'+
        '<span style="min-width:50px;text-align:right;">FAR</span>'+
        '<span style="min-width:95px;text-align:right;">Remaining</span></div>';
  list.forEach(function(p,i){
    var isSel=(highlightId!=null && String(p.id)===String(highlightId));
    var c = colors[p.lu] || '#E0E0E0';
    html+='<div class="ptRow" data-id="'+p.id+'" style="display:flex;align-items:center;gap:10px;padding:6px 11px;'+
          (isSel?'background:#fff4d6;':(i%2?'background:#fafbfc;':''))+'border-left:3px solid '+c+';font-size:12px;cursor:pointer;">'+
          '<span style="min-width:62px;color:#aaa;font-family:monospace;font-size:10.5px;">'+p.id+'</span>'+
          '<span style="flex:1 1 auto;color:#222;">'+p.desc+'</span>'+
          '<span style="min-width:90px;color:#888;font-size:11px;">'+p.lu+'</span>'+
          '<span style="min-width:80px;text-align:right;color:#222;">'+Number(p.gfa).toLocaleString()+'</span>'+
          '<span style="min-width:50px;text-align:right;color:#555;">'+p.far+'</span>'+
          '<span style="min-width:95px;text-align:right;color:'+((p.rem||0)>0?'#19A979':'#bbb')+';">'+((p.rem||0)>0?Number(p.rem).toLocaleString():'—')+'</span>'+
          '</div>';
  });
  html+='</div>';
  box.innerHTML=html;
  Array.prototype.forEach.call(box.querySelectorAll('.ptRow'), function(row){
    row.onclick=function(){
      var id=row.getAttribute('data-id');
      highlightId=(String(highlightId)===String(id))?null:id;
      render(); buildPlotTable();
      if(highlightId!=null){
        var p=plots.filter(function(x){return String(x.id)===String(highlightId);})[0];
        if(p) handlePlotClick([p.id,p.desc,p.pa,p.gfa,(p.built||0),(p.rem||0),p.far,p.lu], false, null);
      }
    };
  });
  if(highlightId!=null){
    var sel=box.querySelector('.ptRow[data-id="'+highlightId+'"]');
    if(sel) sel.scrollIntoView({block:'nearest'});
  }
}
function loadPlotly(urls, idx) {
  if (typeof Plotly !== 'undefined') { startChart(); return; }
  if (idx >= urls.length) { document.getElementById('status').innerHTML = 'Could not load the chart library (no internet access).'; return; }
  const s = document.createElement('script');
  s.src = urls[idx]; s.onload = startChart; s.onerror = function() { loadPlotly(urls, idx+1); };
  document.head.appendChild(s);
}
