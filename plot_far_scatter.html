const maxPA = Math.max.apply(null, plots.map(p => p.pa));
const minPA = Math.min.apply(null, plots.map(p => p.pa));
const maxGFA = Math.max.apply(null, plots.map(p => p.gfa));
const minGFA = Math.min.apply(null, plots.map(p => p.gfa));

function buildPointTraces(sizeBy) {
  const groups = {};
  plots.forEach(p => { if (!groups[p.lu]) groups[p.lu] = []; groups[p.lu].push(p); });
  const traces = [];
  order.forEach(lu => {
    if (!groups[lu]) return;
    const g = groups[lu];
    const sizes = sizeBy === 'gfa' ? g.map(p => 6 + (p.gfa / maxGFA) * 30) : g.map(() => 8);
    traces.push({
      x: g.map(p => p.pa), y: g.map(p => p.gfa),
      mode: 'markers', type: 'scatter', name: lu,
      marker: { size: sizes, color: colors[lu] || '#BDBDBD', line: { width: 0.5, color: '#fff' }, opacity: 0.85 },
      customdata: g.map(p => p.id),
      text: g.map(p => 'Plot ' + p.id + '<br>' + p.desc + '<br>Area: ' + p.pa.toLocaleString() + ' m2<br>GFA: ' + p.gfa.toLocaleString() + ' m2<br>FAR: ' + p.far + '<br><b>(click to copy Plot ID)</b>'),
      hoverinfo: 'text'
    });
  });
  return traces;
}

// FAR lines drawn as LINE TRACES (real coordinates, work on log + linear)
function buildFARTraces() {
  const fars = [0.5, 1, 2, 4];
  // plot bounding box
  const xLo = minPA * 0.85, xHi = maxPA * 1.05;
  const yLo = minGFA * 0.85, yHi = maxGFA * 1.05;
  const traces = [];
  const labelX = [], labelY = [], labelText = [];
  fars.forEach(far => {
    // line y = far * x, clipped to the box
    let ax = xLo, ay = far * xLo;
    if (ay < yLo) { ay = yLo; ax = yLo / far; }
    let bx = xHi, by = far * xHi;
    if (by > yHi) { by = yHi; bx = yHi / far; }
    traces.push({
      x: [ax, bx], y: [ay, by],
      mode: 'lines', type: 'scatter',
      line: { color: '#999', width: 1, dash: far === 1 ? 'dash' : 'dot' },
      hoverinfo: 'skip', showlegend: false
    });
    labelX.push(bx); labelY.push(by); labelText.push('FAR ' + far.toFixed(1));
  });
  // labels as a text trace, nudged just below each line end so they stay visible
  traces.push({
    x: labelX, y: labelY, mode: 'text', type: 'scatter',
    text: labelText, textposition: 'bottom left',
    textfont: { size: 11, color: '#888' },
    hoverinfo: 'skip', showlegend: false,
    cliponaxis: false
  });
  return traces;
}

  const sizeBy = document.getElementById('sizeBy').value;
  const logScale = document.getElementById('scaleType').value === 'log';
  const showFAR = document.getElementById('showFAR').checked;

  let traces = buildPointTraces(sizeBy);
  if (showFAR) traces = traces.concat(buildFARTraces());

  const layout = {
    margin: { l: 75, r: 65, t: 10, b: 55 },
    xaxis: {
      title: 'Plot Area (m2' + (logScale ? ', log scale' : '') + ')',
      type: logScale ? 'log' : 'linear', gridcolor: '#f0f0f0', zeroline: false,
      range: logScale ? [Math.log10(minPA*0.8), Math.log10(maxPA*1.15)] : [0, maxPA*1.05]
    },
    yaxis: {
      title: 'GFA (m2' + (logScale ? ', log scale' : '') + ')',
      type: logScale ? 'log' : 'linear', gridcolor: '#f0f0f0', zeroline: false,
      range: logScale ? [Math.log10(minGFA*0.8), Math.log10(maxGFA*1.15)] : [0, maxGFA*1.05]
    },
    showlegend: true,
    legend: { font: { size: 11 }, x: 1, y: 0, xanchor: 'right', yanchor: 'bottom', bgcolor: 'rgba(255,255,255,0.85)', bordercolor: '#ddd', borderwidth: 1, itemsizing: 'constant' },
    hovermode: 'closest',
    dragmode: 'zoom', plot_bgcolor: '#fff', paper_bgcolor: '#fff'
  };
  Plotly.newPlot('chart', traces, layout, {
    responsive: true,
    displayModeBar: true,
    displaylogo: false,
    modeBarButtonsToRemove: ['select2d', 'lasso2d'],
    scrollZoom: true
  });

  // Click a point to copy its Plot ID to the clipboard
  var chartDiv = document.getElementById('chart');
  chartDiv.on('plotly_click', function(data) {
    var pt = data.points[0];
    if (pt && pt.customdata !== undefined && pt.customdata !== null) {
      var plotId = String(pt.customdata);
      // copy to clipboard
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(plotId).then(function() { showCopied(plotId); }, function() { fallbackCopy(plotId); });
      } else {
        fallbackCopy(plotId);
      }
    }
  });

  function fallbackCopy(txt) {
    var ta = document.createElement('textarea');
    ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand('copy'); showCopied(txt); } catch(e) {}
    document.body.removeChild(ta);
  }

  function showCopied(plotId) {
    var note = document.getElementById('copyNote');
    if (!note) {
      note = document.createElement('div');
      note.id = 'copyNote';
      note.style.cssText = 'position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#19A979;color:#fff;padding:8px 16px;border-radius:8px;font-size:14px;z-index:9999;box-shadow:0 2px 8px rgba(0,0,0,0.2);transition:opacity 0.3s;';
      document.body.appendChild(note);
    }
    note.textContent = 'Copied Plot ID: ' + plotId;
    note.style.opacity = '1';
    clearTimeout(window._copyTimer);
    window._copyTimer = setTimeout(function(){ note.style.opacity = '0'; }, 1800);
  }
}

function startChart() {
  document.getElementById('status').style.display = 'none';
  document.getElementById('chart').style.display = 'block';
  document.getElementById('sizeBy').addEventListener('change', render);
  document.getElementById('scaleType').addEventListener('change', render);
  document.getElementById('showFAR').addEventListener('change', render);
  render();
}
function loadPlotly(urls, idx) {
  if (typeof Plotly !== 'undefined') { startChart(); return; }
  if (idx >= urls.length) { document.getElementById('status').innerHTML = 'Could not load the chart library (no internet access).'; return; }
  const s = document.createElement('script');
  s.src = urls[idx]; s.onload = startChart; s.onerror = function() { loadPlotly(urls, idx+1); };
  document.head.appendChild(s);
}
loadPlotly(['https://cdn.plot.ly/plotly-2.35.2.min.js','https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.35.2/plotly.min.js','https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js'], 0);
</script>
